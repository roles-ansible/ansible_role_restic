---
- name: (PREPARE) Fetch latest restic version from GitHub API
  ansible.builtin.uri:
    url: 'https://api.github.com/repos/restic/restic/releases/latest'
    return_content: true
  register: restic_latest_release
  when: restic_version == 'latest'

- name: (PREPARE) Set restic_version to latest release
  ansible.builtin.set_fact:
    restic_version: '{{ restic_latest_release.json.tag_name | regex_replace("^v", "") }}'
  when: restic_version == 'latest'

- name: (PREPARE) Ensure restic directories exist
  become: true
  ansible.builtin.file:
    state: 'directory'
    path: '{{ item }}'
    mode: '0755'
    owner: '{{ restic_dir_owner }}'
    group: '{{ restic_dir_group }}'
  with_items: '{{ restic_create_paths }}'

- name: (PREPARE) Check if downloaded binary is present
  ansible.builtin.stat:
    path: '{{ restic_download_path }}/bin/restic-{{ restic_version }}'
  register: restic_executable

- name: (PREPARE) Check if installed binary is present
  ansible.builtin.stat:
    path: '{{ restic_install_path }}/restic'
  register: restic_installed
